name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            format: dmg
            artifact: dist/*.dmg
          - os: windows-latest
            format: nsis
            artifact: dist/*-setup.exe
          - os: ubuntu-22.04
            format: appimage
            artifact: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev libfuse2
      - name: Packaging tools
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo install cargo-about --locked --features cli
      # The notices file is listed in Packager.toml, so it must exist before packaging.
      - name: Third-party licences
        run: cargo about generate -m crates/mdk/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Package
        run: cargo packager --release -c Packager.toml --formats ${{ matrix.format }}
      # The notes for this tag are its section of docs/releases.md (empty if there is none).
      - name: Release notes
        shell: bash
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { on = (index($0, "## " tag " ") == 1); next }
            on' docs/releases.md > release-notes.md
          cat >> release-notes.md <<'EOF'

          ### First launch

          The builds are not code-signed yet.

          - macOS says it "could not verify" mdk. Click Done, then open System Settings, Privacy & Security, scroll down and click "Open Anyway". You do this for the `.dmg` and again the first time mdk starts. Or run `xattr -dr com.apple.quarantine /Applications/mdk.app` once.
          - Windows SmartScreen says it protected your PC. Click "More info", then "Run anyway".
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
          body_path: release-notes.md
          generate_release_notes: true
